
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      background: #080b16;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      font-size: 100px;
      margin: 0;
      color: #8b7bff;
    }
    h2 { font-size: 26px; }
    p { color: #a1abc0; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      color: white;
      background: #7665ed;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/Portfolio/">Return to Homepage</a>
  </main>
</body>
</html>
